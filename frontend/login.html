<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Quick Bite Crew</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  height: 100vh;
  background: #020617;
}

/* LEFT PANEL */
.left {
  width: 50%;
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
  animation: fadeIn 1s ease;
}

.left h1 {
  font-size: 42px;
}

.left p {
  opacity: 0.9;
  margin-top: 10px;
}

/* RIGHT PANEL */
.right {
  width: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CARD */
.card {
  background: rgba(30,41,59,0.6);
  backdrop-filter: blur(20px);
  padding: 30px;
  border-radius: 16px;
  width: 320px;
  box-shadow: 0 0 30px rgba(239,68,68,0.2);
  animation: slideUp 0.7s ease;
}

.card h2 {
  margin-bottom: 20px;
}

/* INPUT */
.input-group {
  position: relative;
  margin-bottom: 18px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #0f172a;
  color: white;
  outline: none;
}

.input-group label {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 13px;
  color: #aaa;
  transition: 0.3s;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
  top: -8px;
  font-size: 10px;
  color: #ef4444;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #ef4444;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

button:hover {
  background: #dc2626;
  box-shadow: 0 0 15px rgba(239,68,68,0.6);
}

/* RIPPLE EFFECT */
button:active::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: rgba(255,255,255,0.2);
  top: -50%;
  left: -50%;
  border-radius: 50%;
  animation: ripple 0.5s linear;
}

/* SWITCH */
.switch {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  cursor: pointer;
  color: #aaa;
}

.switch:hover {
  color: #ef4444;
}

.error {
  color: red;
  font-size: 13px;
  margin-top: 10px;
}

/* ANIMATIONS */
@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

@keyframes slideUp {
  from {transform:translateY(40px); opacity:0;}
  to {transform:translateY(0); opacity:1;}
}

@keyframes ripple {
  from {transform: scale(0);}
  to {transform: scale(1); opacity:0;}
}

</style>
</head>

<body>

<div class="left">
  <h1>🍔 Quick Bite Crew</h1>
  <p>Cravings don’t wait. Neither do we.</p>
</div>

<div class="right">

<div class="card">

<h2 id="title">Login</h2>

<div class="input-group" id="nameField" style="display:none;">
  <input type="text" id="name" placeholder=" ">
  <label>Name</label>
</div>

<div class="input-group">
  <input type="email" id="email" placeholder=" ">
  <label>Email</label>
</div>

<div class="input-group">
  <input type="password" id="password" placeholder=" ">
  <label>Password</label>
</div>

<button onclick="submitForm()">Continue</button>

<div class="switch" onclick="toggleMode()">Create new account</div>

<div class="error" id="error"></div>

</div>
</div>

<script>

let isSignup = false;

function toggleMode(){
  isSignup = !isSignup;

  document.getElementById("title").innerText = isSignup ? "Sign Up" : "Login";
  document.getElementById("nameField").style.display = isSignup ? "block" : "none";
  document.querySelector(".switch").innerText = isSignup ? "Already have account?" : "Create new account";
}

function submitForm(){
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(!email || !password){
    return document.getElementById("error").innerText = "Fill all fields";
  }

  if(isSignup && !name){
    return document.getElementById("error").innerText = "Enter name";
  }

  // Fake auth (frontend only)
  const user = {
    name: name || email.split("@")[0],
    email
  };

  localStorage.setItem("user", JSON.stringify(user));

  window.location.href = "index.html";
}

</script>

</body>
</html>
